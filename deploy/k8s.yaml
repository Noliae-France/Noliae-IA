apiVersion: apps/v1
kind: Deployment
metadata: {name: noliae-ia-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: noliae-ia-web}}
  template:
    metadata: {labels: {app: noliae-ia-web}}
    spec:
      containers:
        - name: web
          image: ghcr.io/noliae-france/noliae-ia-web:main
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /api/health, port: 8080}}
          livenessProbe: {httpGet: {path: /api/health, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: noliae-ia-web}
spec:
  selector: {app: noliae-ia-web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: noliae-ia-web}
spec:
  rules:
    - host: ia.noliae.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: noliae-ia-web, port: {number: 80}}}}]}
